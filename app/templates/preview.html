{% extends "base.html" %}

{% block html_attributes %}{% endblock %}
{% block head_meta %}{% endblock %}
{% block title %}GeoSquare Preview{% endblock %}
{% block favicon %}{% endblock %}

{% block head %}
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
{% endblock %}

{% block content %}
<div id="cesiumContainer"></div>
{% endblock %}

{% block scripts %}
<script type="module">
import { initCesium, renderAllSquares } from '@geosquare/map.js';
import { fetchJson } from '@geosquare/api.js';

const params = new URLSearchParams(window.location.search);
const gameDate = params.get('game_date');

async function load() {
    await initCesium();

    const { data } = await fetchJson(`/api/all-daily-squares/preview?game_date=${gameDate}`);

    await renderAllSquares(data.rounds, { preview: true });
}

load();
</script>
{% endblock %}
