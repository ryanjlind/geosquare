# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - GeoSquare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: geosquare-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests


  e2e:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_SQL_SERVER: ${{ secrets.E2E_SQL_SERVER }}
      E2E_DATABASE: ${{ secrets.E2E_SQL_DATABASE }}
      E2E_SQL_USERNAME: ${{ secrets.E2E_SQL_USERNAME }}
      E2E_SQL_PASSWORD: ${{ secrets.E2E_SQL_PASSWORD }}
      SECRET_KEY: ${{ secrets.E2E_SECRET_KEY }}
      E2E_GAME_DATE: '2026-08-01'
      GAME_DATE_OVERRIDE: '2026-08-01'
      E2E_SQUARE_POOL_ID: ${{ vars.E2E_SQUARE_POOL_ID }}
      E2E_RANDOM_SEED: '20260801'
      LOCAL_AUTH_BYPASS: 'true'
      DATABASE_TARGET: 'e2e'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e_tests/package-lock.json

      - name: Install Microsoft ODBC driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        working-directory: e2e_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Create E2E game
        run: python -m e2e_tests.setup_game

      - name: Start Flask
        run: |
          mkdir -p e2e_tests/artifacts
          gunicorn main:app --bind 127.0.0.1:8000 --timeout 60 > e2e_tests/artifacts/flask.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat e2e_tests/artifacts/flask.log
          exit 1

      - name: Run browser E2E tests
        working-directory: e2e_tests
        run: npm test

      - name: Show Flask log on failure
        if: failure()
        run: cat e2e_tests/artifacts/flask.log

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e_tests/artifacts/
          retention-days: 14


  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D3935DCE426F40759AF768EC6FC6F95D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C13238A61C0F4055BD967CDF6744667F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_135F2C1A6FD64F9EBF190CF2A09855C2 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'GeoSquare'
          slot-name: 'Production'
          